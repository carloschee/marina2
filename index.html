<!DOCTYPE html>
<html lang="es-MX">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marina 2">
  <meta name="theme-color" content="#0a3d6b">
  <title>Marina 2</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="icon" type="image/png" href="assets/img/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Outfit:wght@700;800;900&display=swap">

  <style>
    /* ── Variables Marina 2 — Océano Pixar ───────────────────── */
    :root {
      --m-bg: #0a3d6b;
      --m-bg-mid: #0d5a8f;
      --m-surface: rgba(255, 255, 255, 0.13);
      --m-ink: #ffffff;
      --m-ink-soft: rgba(255, 255, 255, 0.68);
      --m-ink-dark: #032340;
      --m-primary: #00c2ff;
      --m-primary-dk: #0090cc;
      --m-accent: #ffe566;
      --m-teal: #00e5b0;
      --m-coral: #ff6b6b;
      --m-gold: #ffb800;
      --t-primary: #00c2ff;
      --t-secondary: #00e5b0;
      --t-accent: #ffe566;
      --t-warn: #ff6b6b;
      --r-sm: 12px;
      --r-md: 18px;
      --r-lg: 26px;
      --r-xl: 36px;
      --s-card: 0 8px 24px rgba(0, 30, 80, 0.30);
      --s-deep: 0 16px 48px rgba(0, 20, 60, 0.45);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Nunito', system-ui, sans-serif;
      background: var(--m-bg);
      color: var(--m-ink);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    /* ── App shell ─────────────────────────────────────────── */
    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: transparent;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ── Header ────────────────────────────────────────────── */
    #app-header {
      flex-shrink: 0;
      padding-top: calc(14px + var(--safe-top));
      padding-bottom: 12px;
      padding-left: 20px;
      padding-right: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg,
          rgba(5, 30, 65, 0.88) 0%,
          rgba(10, 61, 107, 0.50) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0, 194, 255, 0.18);
      box-shadow: 0 4px 24px rgba(0, 20, 60, 0.30);
      position: relative;
      z-index: 20;
    }

    #header-izq {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .menu-logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .menu-logo h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #fff;
      text-shadow: 0 2px 16px rgba(0, 194, 255, 0.45);
    }

    #saludo-nombre {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: rgba(255, 255, 255, 0.45);
      white-space: nowrap;
    }

    #perfil-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px 5px 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      cursor: default;
      max-width: 150px;
    }

    #perfil-chip-avatar {
      font-size: 1.05rem;
      line-height: 1;
      flex-shrink: 0;
    }

    #perfil-chip-apodo {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.72rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #btn-volver {
      display: none;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.14);
      cursor: pointer;
      transition: background .15s, transform .12s;
      flex-shrink: 0;
    }

    #btn-volver:active {
      background: rgba(255, 255, 255, .28);
      transform: scale(.88);
    }

    #modulo-acciones {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
    }

    #header-derecha {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: auto;
    }

    #lang-pill {
      display: flex;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.10);
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      overflow: hidden;
    }

    .lang-btn {
      padding: 5px 14px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
      transition: background .15s, color .15s;
      letter-spacing: 0.05em;
    }

    .lang-btn.activo {
      background: var(--t-primary);
      color: #fff;
    }

    #btn-ajustes-header {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      background: rgba(255, 255, 255, 0.10);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, transform .12s;
    }

    #btn-ajustes-header:active {
      transform: scale(.88);
      background: rgba(255, 255, 255, .22);
    }

    #indicador-offline {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 800;
      white-space: nowrap;
      border: 1.5px solid;
      transition: all .3s;
    }

    #indicador-offline.online {
      background: rgba(0, 229, 176, 0.18);
      border-color: #00e5b0;
      color: #00e5b0;
    }

    #indicador-offline.offline {
      background: rgba(255, 107, 107, 0.18);
      border-color: #ff6b6b;
      color: #ff6b6b;
    }

    #indicador-offline.checking {
      background: rgba(255, 229, 102, 0.18);
      border-color: #ffe566;
      color: #ffe566;
    }

    #dot-conexion {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .online #dot-conexion {
      background: #00e5b0;
    }

    .offline #dot-conexion {
      background: #ff6b6b;
    }

    .checking #dot-conexion {
      background: #ffe566;
    }

    /* ── Body ──────────────────────────────────────────────── */
    #app-body {
      flex: 1;
      min-height: 0;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    #vista-menu {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Grid de módulos ───────────────────────────────────── */
    #menu-grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 340px));
      grid-template-rows: repeat(2, 1fr);
      gap: 14px;
      padding: 12px 16px;
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      justify-content: center;
      align-content: center;
      transition: grid-template-columns .35s ease, gap .3s ease, padding .3s ease;
    }

    /* ── Module tile ───────────────────────────────────────── */
    .module-tile {
      border-radius: var(--r-xl);
      box-shadow: 0 8px 24px rgba(0, 20, 60, 0.25);
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease,
        width .3s ease, height .3s ease,
        min-height .3s ease, max-height .3s ease,
        font-size .3s ease, opacity .4s ease,
        background-image .4s ease, background-color .4s ease;
      opacity: 0;
      animation: tile-fadein .4s ease forwards;
      min-height: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: rgba(255, 255, 255, 0.10);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 0 0 14px;
      overflow: hidden;
      position: relative;
    }

    @keyframes tile-fadein {
      from {
        opacity: 0;
        transform: scale(.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .module-tile:active {
      transform: scale(.92);
      box-shadow: 0 4px 12px rgba(0, 20, 60, 0.30);
    }

    .module-tile::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 55%;
      background: linear-gradient(to top,
          rgba(2, 20, 50, 0.75) 0%,
          rgba(2, 20, 50, 0.20) 60%,
          transparent 100%);
      border-radius: 0 0 var(--r-xl) var(--r-xl);
      pointer-events: none;
    }

    .tile-label {
      position: relative;
      z-index: 1;
      font-size: 1.1rem;
      font-weight: 900;
      transition: font-size .3s ease, opacity .3s ease;
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.70);
      line-height: 1.2;
      padding: 0 10px;
    }

    /* ── Botones nav ───────────────────────────────────────── */
    .d-nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 14px;
      border-radius: 99px;
      border: none;
      background: rgba(255, 255, 255, 0.14);
      color: white;
      font-size: .8rem;
      font-weight: 800;
      cursor: pointer;
      gap: 5px;
      white-space: nowrap;
      transition: background .15s, transform .12s;
      font-family: inherit;
    }

    .d-nav-btn:active {
      background: rgba(255, 255, 255, .28);
      transform: scale(.93);
    }

    /* ── Modal PIN ─────────────────────────────────────────── */
    #modal-pin {
      position: fixed;
      inset: 0;
      background: rgba(2, 20, 50, 0.80);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9000;
      backdrop-filter: blur(16px);
    }

    #modal-pin.visible {
      display: flex;
    }

    .pin-box {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: var(--r-xl);
      padding: 32px;
      width: 88%;
      max-width: 340px;
      text-align: center;
      box-shadow: var(--s-deep);
    }

    .pin-box h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 900;
      margin-bottom: 8px;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 194, 255, 0.40);
    }

    #pin-hint {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--m-accent);
      text-shadow: 0 1px 6px rgba(255, 229, 102, 0.50);
    }

    #input-pin {
      width: 100%;
      padding: 16px;
      text-align: center;
      font-size: 2.8rem;
      font-weight: 900;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: var(--r-md);
      outline: none;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.10);
      color: #fff;
      font-family: inherit;
    }

    #input-pin:focus {
      border-color: var(--t-primary);
      box-shadow: 0 0 0 3px rgba(0, 194, 255, 0.25);
    }

    .pin-btns {
      display: flex;
      gap: 10px;
    }

    .pin-btns button {
      flex: 1;
      padding: 14px;
      border-radius: var(--r-md);
      border: none;
      font-weight: 900;
      font-size: 1.1rem;
      cursor: pointer;
      font-family: inherit;
    }

    #btn-pin-ok {
      background: var(--t-primary);
      color: #032340;
    }

    #btn-pin-cancel {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.20);
    }

    #pin-error {
      color: var(--m-coral);
      font-size: .95rem;
      font-weight: 800;
      margin-top: 8px;
      min-height: 1em;
      text-shadow: 0 1px 4px rgba(255, 107, 107, 0.40);
    }

    /* ═══════════════════════════════════════════════════════════
       RESPONSIVE — iPhone 13 portrait (≤430px, portrait)
       Viewport: 390×844pt — objetivo principal phone
    ═══════════════════════════════════════════════════════════ */
    @media (max-width: 600px) and (orientation: portrait) {

      /* Header compacto */
      #app-header {
        padding-top: calc(10px + var(--safe-top));
        padding-bottom: 10px;
        padding-left: 14px;
        padding-right: 12px;
        gap: 8px;
      }

      .menu-logo h1,
      #saludo-nombre {
        font-size: 1.25rem;
      }

      #perfil-chip {
        display: none !important;
      }

      #texto-conexion {
        display: none;
      }

      #indicador-offline {
        padding: 4px 8px;
      }

      .lang-btn {
        padding: 5px 11px;
        font-size: 0.73rem;
      }

      #btn-ajustes-header {
        width: 32px;
        height: 32px;
        font-size: 1rem;
      }

      #btn-volver {
        width: 36px;
        height: 36px;
      }

      /* Menú — 2 columnas en portrait */
      #menu-grid {
        grid-template-columns: 1fr;
        /* ← una columna */
        grid-template-rows: repeat(4, 1fr);
        /* ← 4 filas explícitas */
        align-content: stretch;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        gap: 10px;
        padding: 10px 14px;
        padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
      }

      module-tile {
        min-height: 120px;
        max-height: none;
        /* ← sin límite: las filas reparten el espacio */
        background-size: auto 85%;
        background-position: right 16px center;
        background-repeat: no-repeat;
      }

      .tile-label {
        font-size: .95rem;
        /* ← ligeramente más grande al tener más ancho */
      }

      /* PIN */
      .pin-box {
        padding: 24px 18px;
      }

      .pin-box h3 {
        font-size: 1.1rem;
      }

      #pin-hint {
        font-size: 1rem;
        margin-bottom: 12px;
      }

      #input-pin {
        font-size: 2.2rem;
        padding: 13px;
        margin-bottom: 10px;
      }

      .pin-btns button {
        padding: 13px;
        font-size: 1rem;
      }
    }

    /* ═══════════════════════════════════════════════════════════
       RESPONSIVE — iPhone SE 3 portrait (≤375px, portrait)
       Viewport: 375×667pt — pantalla más pequeña
       Estrategia: reducir todo, ocultar lo que no cabe
    ═══════════════════════════════════════════════════════════ */
    @media (max-width: 375px) and (orientation: portrait) {

      /* Header mínimo */
      #app-header {
        padding-top: calc(8px + var(--safe-top));
        padding-bottom: 8px;
        padding-left: 10px;
        padding-right: 8px;
        gap: 6px;
      }

      .menu-logo h1,
      #saludo-nombre {
        font-size: 1.05rem;
      }

      #saludo-nombre {
        display: none;
      }

      #texto-conexion {
        display: none;
      }

      #indicador-offline {
        padding: 3px 6px;
        font-size: 0.65rem;
      }

      #dot-conexion {
        width: 5px;
        height: 5px;
      }

      .lang-btn {
        padding: 4px 9px;
        font-size: 0.68rem;
      }

      #lang-pill {
        margin-right: 4px;
      }

      #btn-ajustes-header {
        width: 28px;
        height: 28px;
        font-size: 0.9rem;
      }

      #btn-volver {
        width: 32px;
        height: 32px;
      }

      /* Menú */
      #menu-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto;
        align-content: start;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        gap: 8px;
        padding: 8px 10px;
        padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      }

      .module-tile {
        min-height: 120px;
        max-height: 160px;
        background-size: 100% auto;
        background-position: center top;
      }

      .tile-label {
        font-size: 0.8rem;
      }

      /* PIN */
      .pin-box {
        padding: 20px 14px;
        border-radius: var(--r-lg);
      }

      .pin-box h3 {
        font-size: 1rem;
      }

      #pin-hint {
        font-size: 0.9rem;
        margin-bottom: 10px;
      }

      #input-pin {
        font-size: 1.9rem;
        padding: 11px;
        margin-bottom: 8px;
      }

      .pin-btns button {
        padding: 11px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <header id="app-header"></header>
    <div id="app-body">
      <div id="vista-menu">
        <div id="menu-grid"></div>
      </div>
    </div>
  </div>

  <div id="modal-pin" role="dialog" aria-modal="true" aria-labelledby="pin-titulo">
    <div class="pin-box">
      <h3 id="pin-titulo">Área de adultos</h3>
      <div id="pin-hint"></div>
      <input id="input-pin" type="number" inputmode="numeric" autocomplete="off" min="1" max="18" />
      <div class="pin-btns">
        <button id="btn-pin-cancel">Cancelar</button>
        <button id="btn-pin-ok">Abrir</button>
      </div>
      <div id="pin-error"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>

</html>
